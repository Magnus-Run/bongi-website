<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>Bongi OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf8f3;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #faf8f3;
    display: flex;
    position: relative;
    overflow: hidden;
  }
  /* Left content area */
  .left {
    flex: 0 0 680px;
    padding: 64px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }
  .logo {
    display: block;
    width: 160px;
    height: auto;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0 0;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #c84b20;
    margin-bottom: 20px;
  }
  .headline {
    font-family: 'Lora', serif;
    font-size: 46px;
    font-weight: 700;
    line-height: 1.18;
    color: #1c1a17;
    margin-bottom: 28px;
    max-width: 520px;
  }
  .headline em {
    font-style: italic;
    color: #c84b20;
  }
  .tagline {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: #4a4640;
    line-height: 1.5;
    max-width: 460px;
  }
  .footer {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #1c1a17;
    letter-spacing: 0.02em;
    opacity: 0.55;
  }
  /* Right accent area */
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .accent-block {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    background: #c84b20;
    clip-path: polygon(18% 0%, 100% 0%, 100% 100%, 0% 100%);
  }
  .accent-inner {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 60px;
  }
  .quote-mark {
    font-family: 'Lora', serif;
    font-size: 220px;
    font-weight: 700;
    color: rgba(255,255,255,0.12);
    line-height: 1;
    position: absolute;
    top: 20px;
    right: 40px;
    pointer-events: none;
    display: none;
  }
  .right-text {
    position: relative;
    z-index: 2;
    padding: 0 50px;
    text-align: center;
  }
  .right-text .service {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 18px;
    display: block;
  }
  .right-text .big-word {
    font-family: 'Lora', serif;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    display: block;
    margin-bottom: 10px;
  }
  .divider-line {
    width: 40px;
    height: 2px;
    background: rgba(255,255,255,0.5);
    margin: 18px auto;
  }
  .right-text .sub {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
  }
  /* Subtle grain texture overlay */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 150px;
  }
  /* Left edge accent bar */
  .left-bar {
    position: absolute;
    left: 0;
    top: 0;
    width: 5px;
    height: 100%;
    background: #c84b20;
  }
</style>
</head>
